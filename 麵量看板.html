<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="煮麵看板">
<title>煮麵看板</title>
<style>
:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
html { height: 100%; overflow: hidden; position: fixed; width: 100%; }
body {
  height: 100%; width: 100%;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: row; flex-direction: row;
  background: #0a0a0a;
  font-family: -apple-system, '蘋方-繁', 'PingFang TC', sans-serif;
  color: #fff;
  padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
  padding-left: var(--safe-left); padding-right: var(--safe-right);
}

/* ══ LEFT：麵種按鈕 ══ */
.left {
  width: 200px; -webkit-flex-shrink: 0; flex-shrink: 0;
  background: #141414; border-right: 2px solid #2a2a2a;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column; overflow: hidden;
}
.order-btns {
  -webkit-flex: 1; flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 10px 10px;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column; gap: 8px;
}
.order-btn {
  width: 100%; min-height: 64px; border-radius: 14px; border: none;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  cursor: pointer; touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-appearance: none; appearance: none;
  position: relative;
  /* 選中外框 */
  outline: 4px solid transparent;
  outline-offset: 2px;
  -webkit-transition: outline-color .15s; transition: outline-color .15s;
}
.order-btn.selected {
  outline-color: #fff;
}
.order-btn:active { opacity: 0.65; }
.btn-name { font-size: 26px; font-weight: 900; text-align: center; }
.btn-count {
  font-size: 16px; font-weight: 900;
  background: rgba(0,0,0,0.2); border-radius: 20px;
  padding: 2px 10px; min-width: 32px; text-align: center;
  display: none; margin-left: 6px;
}
.btn-count.show { display: block; }

/* ══ RIGHT：看板 ══ */
.right {
  -webkit-flex: 1; flex: 1; background: #0a0a0a;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column; overflow: hidden;
}

/* 右側 header */
.right-header {
  padding: 10px 16px 8px; border-bottom: 2px solid #1e1e1e; background: #111;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-flex-shrink: 0; flex-shrink: 0;
}
.right-title { font-size: 18px; font-weight: 900; }
.pending-badge { font-size: 14px; color: #888; }
.pending-badge b { color: #fff; font-size: 22px; font-weight: 900; }

/* ══ 選項列（乾湯大小 + 內外）══ */
.option-bar {
  -webkit-flex-shrink: 0; flex-shrink: 0;
  padding: 10px 12px;
  background: #161616;
  border-bottom: 2px solid #2a2a2a;
  display: -webkit-flex; display: flex;
  gap: 10px;
}
.opt-group {
  display: -webkit-flex; display: flex;
  gap: 8px;
}
.opt-divider {
  width: 2px; background: #333; border-radius: 2px; margin: 0 4px;
}
.opt-btn {
  min-width: 72px; min-height: 64px;
  border-radius: 14px;
  border: 3px solid #333;
  background: #222;
  color: #888;
  font-size: 28px; font-weight: 900;
  cursor: pointer; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-appearance: none; appearance: none;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  -webkit-transition: all .15s; transition: all .15s;
}
.opt-btn:active { opacity: 0.65; }
/* 選中狀態 */
.opt-btn.sel-soup  { border-color: #4a90d0; background: #0a2040; color: #7ec8f8; }
.opt-btn.sel-dry   { border-color: #888;    background: #2a2a2a; color: #fff;    }
.opt-btn.sel-big   { border-color: #d0a040; background: #2a1a00; color: #ffd060; }
.opt-btn.sel-small { border-color: #888;    background: #2a2a2a; color: #fff;    }
.opt-btn.sel-out   { border-color: #d06020; background: #2a1000; color: #f0a040; }
.opt-btn.sel-in    { border-color: #40a060; background: #0a2010; color: #60d080; }

/* 提示：尚未選麵種 */
.no-noodle-hint {
  font-size: 13px; color: #555;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  margin-left: 8px;
}

/* ══ 色塊看板 ══ */
.board {
  -webkit-flex: 1; flex: 1; overflow-y: scroll;
  -webkit-overflow-scrolling: touch; overflow-x: hidden;
  padding: 14px 14px 20px;
}
.board-empty {
  height: 100%; display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  gap: 12px; opacity: 0.2; pointer-events: none;
}
.board-empty .ei { font-size: 56px; }
.board-empty .et { font-size: 18px; font-weight: 700; color: #666; }

.tiles {
  display: -webkit-flex; display: flex;
  -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: 14px;
}

/* ══ 色塊 ══ */
.tile {
  width: 130px; height: 140px; border-radius: 22px; border: none;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  gap: 6px; cursor: pointer;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; touch-action: manipulation;
  -webkit-animation: pop-in .2s cubic-bezier(.34,1.56,.64,1) both;
  animation: pop-in .2s cubic-bezier(.34,1.56,.64,1) both;
}
.tile:active { opacity: 0.55; }
@-webkit-keyframes pop-in {
  from { opacity:0; -webkit-transform:scale(0.4); } to { opacity:1; -webkit-transform:scale(1); }
}
@keyframes pop-in {
  from { opacity:0; transform:scale(0.4); } to { opacity:1; transform:scale(1); }
}
.tile.removing {
  -webkit-animation: tile-out .15s ease-in forwards !important;
  animation: tile-out .15s ease-in forwards !important; pointer-events: none;
}
@-webkit-keyframes tile-out {
  from { opacity:1; -webkit-transform:scale(1); } to { opacity:0; -webkit-transform:scale(0.2); }
}
@keyframes tile-out {
  from { opacity:1; transform:scale(1); } to { opacity:0; transform:scale(0.2); }
}
.tile-name { font-size: 24px; font-weight: 900; }
.tile-sub  { font-size: 20px; font-weight: 900; opacity: 0.88; }

/* ══ Reset corner ══ */
.reset-corner {
  position: fixed; bottom: calc(16px + var(--safe-bottom)); right: calc(16px + var(--safe-right));
  width: 56px; height: 56px; border-radius: 50%;
  border: 2px solid #2a2a2a; background: #181818; color: #444; font-size: 20px;
  cursor: pointer;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: none; z-index: 100;
  -webkit-transition: border-color .2s, background .2s, color .2s;
  transition: border-color .2s, background .2s, color .2s;
}
.reset-corner.pressing { border-color: #ff5555; background: #2a1010; color: #ff5555; }
.reset-corner svg { position: absolute; top:0; left:0;
  -webkit-transform: rotate(-90deg); transform: rotate(-90deg); pointer-events: none; }
.reset-corner circle {
  fill: none; stroke: #ff5555; stroke-width: 3;
  stroke-dasharray: 163; stroke-dashoffset: 163; stroke-linecap: round;
  -webkit-transition: none; transition: none;
}
.reset-corner.pressing circle {
  stroke-dashoffset: 0;
  -webkit-transition: stroke-dashoffset 3s linear; transition: stroke-dashoffset 3s linear;
}

/* ══ Toast ══ */
.toast {
  position: fixed; bottom: calc(18px + var(--safe-bottom)); left: 50%;
  -webkit-transform: translateX(-50%) translateY(14px); transform: translateX(-50%) translateY(14px);
  background: #111; border: 2px solid #444; border-radius: 14px; padding: 12px 24px;
  font-size: 16px; font-weight: 700; color: #fff;
  z-index: 999; opacity: 0; pointer-events: none; white-space: nowrap;
  -webkit-transition: opacity .2s, -webkit-transform .2s; transition: opacity .2s, transform .2s;
}
.toast.show { opacity:1; -webkit-transform:translateX(-50%) translateY(0); transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- LEFT: 麵種 -->
<div class="left">
  <div class="order-btns" id="orderBtns"></div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="right-header">
    <div class="right-title">🍜 煮麵看板</div>
    <div class="pending-badge">待煮 <b id="pendingCount">0</b> 份</div>
  </div>

  <!-- 選項列 -->
  <div class="option-bar">
    <!-- 乾 / 湯 -->
    <div class="opt-group">
      <button type="button" class="opt-btn" id="opt-dry"  onclick="selectOpt('soup',false)">乾</button>
      <button type="button" class="opt-btn" id="opt-soup" onclick="selectOpt('soup',true)">湯</button>
    </div>
    <div class="opt-divider"></div>
    <!-- 小 / 大 -->
    <div class="opt-group">
      <button type="button" class="opt-btn" id="opt-small" onclick="selectOpt('big',false)">小</button>
      <button type="button" class="opt-btn" id="opt-big"   onclick="selectOpt('big',true)">大</button>
    </div>
    <div class="opt-divider"></div>
    <!-- 內 / 外 -->
    <div class="opt-group">
      <button type="button" class="opt-btn" id="opt-in"  onclick="selectOpt('takeout',false)">內</button>
      <button type="button" class="opt-btn" id="opt-out" onclick="selectOpt('takeout',true)">外</button>
    </div>
    <div class="no-noodle-hint" id="hintText">← 先選麵種</div>
  </div>

  <!-- 色塊看板 -->
  <div class="board" id="board">
    <div class="board-empty" id="boardEmpty">
      <div class="ei">🫕</div>
      <div class="et">左側選麵種，上方選乾湯大小</div>
    </div>
  </div>
</div>

<div class="reset-corner" id="resetCorner">
  <svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="26"/></svg>
  🗑
</div>
<div class="toast" id="toast"></div>

<script>
var NOODLES = [
  { id:'oil',   name:'油麵',   bg:'#F5C518', text:'#1a1000' },
  { id:'thick', name:'粗陽春', bg:'#F0F0F0', text:'#111111' },
  { id:'thin',  name:'細陽春', bg:'#A8D8F0', text:'#0a2a40' },
  { id:'bean',  name:'冬粉',   bg:'#7ED98A', text:'#082210' },
  { id:'rice',  name:'米粉',   bg:'#C8A0E8', text:'#1a0030' },
  { id:'meat',  name:'肉羹',   bg:'#E8503A', text:'#fff'    },
  { id:'squid', name:'花枝',   bg:'#F9C8E0', text:'#3a0020' },
  { id:'fish',  name:'魚酥',   bg:'#F4A44A', text:'#2a1000' },
  { id:'squid2',name:'魷魚',   bg:'#7EC8E8', text:'#002a3a' },
];

/* 當前選擇狀態 */
var state = {
  noodle:  null,   // 選中的麵種 id
  soup:    false,
  big:     false,
  takeout: false,
};

var tiles = load();
var seq = tiles.length ? Math.max.apply(null, tiles.map(function(t){ return t.s||0; })) : 0;

/* ── Audio ── */
var _ctx = null;
function actx() {
  if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (_ctx.state === 'suspended') _ctx.resume();
  return _ctx;
}
function beep(type) {
  try {
    var c = actx();
    var pairs = type==='add' ? [[440,0],[660,0.1]] : [[660,0],[440,0.1]];
    pairs.forEach(function(p){
      var o=c.createOscillator(), g=c.createGain();
      o.connect(g); g.connect(c.destination);
      o.frequency.value=p[0];
      var t=c.currentTime+p[1];
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.2,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
      o.start(t); o.stop(t+0.22);
    });
  } catch(e){}
}

/* ── Storage ── */
function load() {
  try { return JSON.parse(localStorage.getItem('nm6')||'[]'); } catch(e){ return []; }
}
function save() {
  try { localStorage.setItem('nm6', JSON.stringify(tiles)); } catch(e){}
}
function getNoodle(id) {
  for (var i=0;i<NOODLES.length;i++) if(NOODLES[i].id===id) return NOODLES[i];
  return {id:id, name:id, bg:'#888', text:'#000'};
}

/* ── 選項按鈕高亮 ── */
function updateOptUI() {
  /* 乾/湯 */
  document.getElementById('opt-dry').className  = 'opt-btn' + (!state.soup ? ' sel-dry'  : '');
  document.getElementById('opt-soup').className = 'opt-btn' + ( state.soup ? ' sel-soup' : '');
  /* 小/大 */
  document.getElementById('opt-small').className = 'opt-btn' + (!state.big ? ' sel-small' : '');
  document.getElementById('opt-big').className   = 'opt-btn' + ( state.big ? ' sel-big'   : '');
  /* 內/外 */
  document.getElementById('opt-in').className  = 'opt-btn' + (!state.takeout ? ' sel-in'  : '');
  document.getElementById('opt-out').className = 'opt-btn' + ( state.takeout ? ' sel-out' : '');

  /* 提示文字 */
  document.getElementById('hintText').textContent = state.noodle ? '' : '← 先選麵種';
}

function selectOpt(key, val) {
  actx();
  state[key] = val;
  updateOptUI();
  tryAddTile();
}

/* ── 左側麵種選擇 ── */
function selectNoodle(id) {
  actx();
  state.noodle = id;
  /* 高亮選中按鈕 */
  var btns = document.querySelectorAll('.order-btn');
  for (var i=0;i<btns.length;i++) btns[i].classList.remove('selected');
  var el = document.getElementById('obtn-'+id);
  if (el) el.classList.add('selected');
  updateOptUI();
  tryAddTile();
}

/* ── 當麵種和選項都有了 → 自動加入色塊 ── */
function tryAddTile() {
  if (!state.noodle) return;
  /* 只要有麵種就加，選項有預設值（乾/小/內）*/
  seq++;
  var t = {
    id: Date.now().toString(36)+(seq%999),
    s: seq,
    n: state.noodle,
    soup:    state.soup,
    big:     state.big,
    takeout: state.takeout,
  };
  tiles.push(t);
  save();
  addTileToDOM(t);
  updateBtnCounts();
  beep('add');

  /* 加完清掉麵種選擇，等下一次點麵種 */
  state.noodle = null;
  var btns = document.querySelectorAll('.order-btn');
  for (var i=0;i<btns.length;i++) btns[i].classList.remove('selected');
  updateOptUI();
}

/* ── Build left buttons ── */
function buildButtons() {
  var c = document.getElementById('orderBtns');
  c.innerHTML = '';
  NOODLES.forEach(function(n) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'order-btn';
    btn.id = 'obtn-'+n.id;
    btn.style.background = n.bg;
    btn.innerHTML =
      '<span class="btn-name" style="color:'+n.text+'">'+n.name+'</span>'+
      '<span class="btn-count" id="bcnt-'+n.id+'" style="color:'+n.text+'">0</span>';
    btn.onclick = (function(id){ return function(){ selectNoodle(id); }; })(n.id);
    c.appendChild(btn);
  });
}

function updateBtnCounts() {
  NOODLES.forEach(function(n){
    var cnt = tiles.filter(function(t){ return t.n===n.id; }).length;
    var el = document.getElementById('bcnt-'+n.id);
    if (!el) return;
    el.textContent = cnt;
    if (cnt>0) el.classList.add('show'); else el.classList.remove('show');
  });
  document.getElementById('pendingCount').textContent = tiles.length;
}

/* ── Add tile to DOM ── */
function addTileToDOM(tile) {
  var board = document.getElementById('board');
  document.getElementById('boardEmpty').style.display = 'none';

  var grid = document.getElementById('flat-grid');
  if (!grid) {
    grid = document.createElement('div');
    grid.className = 'tiles';
    grid.id = 'flat-grid';
    board.appendChild(grid);
  }

  var n = getNoodle(tile.n);
  var el = document.createElement('div');
  el.className = 'tile';
  el.id = 'tile-'+tile.id;
  el.style.background = n.bg;

  if (tile.takeout) {
    el.style.outline = '4px dashed rgba(0,0,0,0.4)';
    el.style.outlineOffset = '-4px';
  }
  if (tile.soup) {
    el.style.boxShadow = 'inset 0 0 0 4px rgba(0,100,180,0.5)';
  }

  var sub = (tile.soup?'湯':'乾') + '・' + (tile.big?'大':'小') + '・' + (tile.takeout?'外':'內');

  el.innerHTML =
    '<div class="tile-name" style="color:'+n.text+'">'+n.name+'</div>'+
    '<div class="tile-sub"  style="color:'+n.text+'">'+sub+'</div>';

  el.onclick = (function(id){ return function(){ removeTile(id); }; })(tile.id);
  grid.appendChild(el);
}

/* ── Remove tile ── */
function removeTile(id) {
  var el = document.getElementById('tile-'+id);
  if (!el) return;
  beep('done');
  el.classList.add('removing');
  el.onclick = null;
  setTimeout(function(){
    tiles = tiles.filter(function(t){ return t.id!==id; });
    save();
    if (el.parentNode) el.parentNode.removeChild(el);
    if (!tiles.length) {
      var board=document.getElementById('board');
      var empty=document.getElementById('boardEmpty');
      board.innerHTML=''; board.appendChild(empty);
      empty.style.display='flex';
    }
    updateBtnCounts();
  }, 160);
}

/* ── Reset (long press 3s) ── */
var pressTimer=null, pressingReset=false;
function resetStart(e) {
  e.preventDefault(); if (pressingReset) return; pressingReset=true;
  document.getElementById('resetCorner').classList.add('pressing');
  pressTimer=setTimeout(doReset, 3000);
}
function resetEnd() {
  if (!pressingReset) return; pressingReset=false;
  clearTimeout(pressTimer);
  document.getElementById('resetCorner').classList.remove('pressing');
}
function doReset() {
  pressingReset=false;
  document.getElementById('resetCorner').classList.remove('pressing');
  if (!tiles.length){ showToast('目前沒有訂單'); return; }
  tiles=[]; save();
  var board=document.getElementById('board'), empty=document.getElementById('boardEmpty');
  board.innerHTML=''; board.appendChild(empty); empty.style.display='flex';
  updateBtnCounts(); showToast('已清除所有訂單');
}

function showToast(msg) {
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); },2000);
}

/* ── Restore ── */
function restore() {
  if (!tiles.length) return;
  tiles.forEach(function(t){ addTileToDOM(t); });
  updateBtnCounts();
}

/* ── Wake Lock ── */
function wakeLock(){
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function(){});
}
document.addEventListener('visibilitychange',function(){
  if (document.visibilityState==='visible') wakeLock();
});

var rc=document.getElementById('resetCorner');
rc.addEventListener('touchstart',resetStart,{passive:false});
rc.addEventListener('touchend',  resetEnd,  false);
rc.addEventListener('touchcancel',resetEnd, false);
rc.addEventListener('mousedown', resetStart,false);
rc.addEventListener('mouseup',   resetEnd,  false);
rc.addEventListener('mouseleave',resetEnd,  false);

buildButtons();
updateOptUI();
restore();
wakeLock();
</script>
</body>
</html>
