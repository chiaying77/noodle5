<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="煮麵看板">
<title>煮麵看板</title>
<style>
:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
html { height: 100%; overflow: hidden; position: fixed; width: 100%; }
body {
  height: 100%; width: 100%;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: row; flex-direction: row;
  background: #0a0a0a;
  font-family: -apple-system, '蘋方-繁', 'PingFang TC', sans-serif;
  color: #fff;
  padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
  padding-left: var(--safe-left); padding-right: var(--safe-right);
}

/* ══ 左側 1/3 ══ */
.left-panel {
  width: 36%;
  -webkit-flex-shrink: 0; flex-shrink: 0;
  background: #111;
  border-right: 2px solid #2a2a2a;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  padding: 6px;
  gap: 4px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* 每個群組 */
.group { -webkit-flex-shrink: 0; flex-shrink: 0; }

.group-label {
  font-size: 13px; font-weight: 700; color: #444;
  letter-spacing: 3px; padding: 1px 2px 2px;
}

.btn-row {
  display: -webkit-flex; display: flex;
  gap: 6px;
  min-height: 120px; /* 麵種 */
}

/* 通用選項按鈕 */
.sel-btn {
  -webkit-flex: 1; flex: 1;
  height: auto; min-height: 56px;
  border-radius: 12px;
  border: 2px solid #2a2a2a;
  background: #1a1a1a; color: #444;
  font-size: 26px; font-weight: 900;
  cursor: pointer; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-appearance: none; appearance: none;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  writing-mode: vertical-rl;
  -webkit-writing-mode: vertical-rl;
  text-orientation: upright;
  -webkit-transition: all .1s; transition: all .1s;
}
.sel-btn:active { opacity: 0.6; }

/* 選中樣式 */
.sel-btn.on-noodle  { border-color: #F5C518; background: #2a1f00; color: #F5C518; }
.sel-btn.on-topping { border-color: #E8503A; background: #2a0a00; color: #ff8060; }
.sel-btn.on-soup    { border-color: #4a90d0; background: #0a2040; color: #7ec8f8; }
.sel-btn.on-size    { border-color: #d0a040; background: #2a1a00; color: #ffd060; }
.sel-btn.on-place   { border-color: #40a060; background: #0a2010; color: #60d080; }

.group-divider {
  height: 1px; background: #222; margin: 1px 0;
  -webkit-flex-shrink: 0; flex-shrink: 0;
}

/* 送出 */
.submit-btn {
  width: 100%; height: 52px;
  border-radius: 12px; border: 2px solid #2a2a2a;
  background: #1a1a1a; color: #333;
  font-size: 28px; font-weight: 900;
  cursor: pointer; touch-action: manipulation;
  -webkit-appearance: none; appearance: none;
  -webkit-flex-shrink: 0; flex-shrink: 0;
  margin-top: 4px;
  -webkit-transition: all .15s; transition: all .15s;
}
.submit-btn.ready {
  border-color: #e8a000;
  background: linear-gradient(135deg, #e8a000, #c07800);
  color: #fff;
  box-shadow: 0 3px 12px rgba(232,160,0,0.3);
}
.submit-btn.ready:active { opacity: 0.7; }

/* ══ 右側 2/3 ══ */
.right-panel {
  -webkit-flex: 1; flex: 1;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  overflow: hidden; background: #0a0a0a;
}

.board-header {
  padding: 10px 14px; background: #111; border-bottom: 2px solid #1e1e1e;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-flex-shrink: 0; flex-shrink: 0;
}
.board-title { font-size: 18px; font-weight: 900; }
.pending-badge { font-size: 14px; color: #888; }
.pending-badge b { color: #fff; font-size: 22px; font-weight: 900; }

.board {
  -webkit-flex: 1; flex: 1;
  overflow-y: scroll; -webkit-overflow-scrolling: touch;
  padding: 10px 12px 60px;
}
.board-empty {
  height: 100%; display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  gap: 10px; opacity: 0.2; pointer-events: none;
}
.board-empty .ei { font-size: 52px; }
.board-empty .et { font-size: 16px; font-weight: 700; color: #666; }

/* 訂單列 */
.order-row {
  display: -webkit-flex; display: flex;
  -webkit-align-items: stretch; align-items: stretch;
  margin-bottom: 8px; border-radius: 14px; overflow: hidden;
  min-height: 58px; cursor: pointer; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-animation: row-in .2s cubic-bezier(.34,1.56,.64,1) both;
  animation: row-in .2s cubic-bezier(.34,1.56,.64,1) both;
}
.order-row:active { opacity: 0.5; }
@-webkit-keyframes row-in {
  from { opacity:0; -webkit-transform:translateX(16px); }
  to   { opacity:1; -webkit-transform:translateX(0); }
}
@keyframes row-in {
  from { opacity:0; transform:translateX(16px); }
  to   { opacity:1; transform:translateX(0); }
}
.order-row.removing {
  -webkit-animation: row-out .2s ease-in forwards !important;
  animation: row-out .2s ease-in forwards !important; pointer-events: none;
}
@-webkit-keyframes row-out {
  from { opacity:1; max-height:100px; margin-bottom:8px; }
  to   { opacity:0; max-height:0;     margin-bottom:0; }
}
@keyframes row-out {
  from { opacity:1; max-height:100px; margin-bottom:8px; }
  to   { opacity:0; max-height:0;     margin-bottom:0; }
}
.row-bar { width: 12px; -webkit-flex-shrink: 0; flex-shrink: 0; }
.row-body {
  -webkit-flex: 1; flex: 1; background: #1c1c1c;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  padding: 6px 14px; gap: 8px;
  -webkit-flex-wrap: wrap; flex-wrap: wrap;
}
.row-tag {
  font-size: 28px; font-weight: 900;
  padding: 3px 12px; border-radius: 8px; white-space: nowrap;
}
.rt-noodle  { background: #2a1f00; color: #F5C518; }
.rt-topping { background: #2a0a00; color: #ff8060; }
.rt-soup    { background: #0a2040; color: #7ec8f8; }
.rt-size    { background: #2a1a00; color: #ffd060; }
.rt-place   { background: #0a2010; color: #60d080; }

/* ══ Reset ══ */
.reset-corner {
  position: fixed; bottom: calc(14px + var(--safe-bottom)); right: calc(14px + var(--safe-right));
  width: 50px; height: 50px; border-radius: 50%;
  border: 2px solid #2a2a2a; background: #181818; color: #444; font-size: 18px;
  cursor: pointer;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: none; z-index: 100;
}
.reset-corner.pressing { border-color: #ff5555; background: #2a1010; color: #ff5555; }
.reset-corner svg { position: absolute; top:0; left:0;
  -webkit-transform: rotate(-90deg); transform: rotate(-90deg); pointer-events: none; }
.reset-corner circle {
  fill: none; stroke: #ff5555; stroke-width: 3;
  stroke-dasharray: 145; stroke-dashoffset: 145; stroke-linecap: round;
  -webkit-transition: none; transition: none;
}
.reset-corner.pressing circle {
  stroke-dashoffset: 0;
  -webkit-transition: stroke-dashoffset 3s linear; transition: stroke-dashoffset 3s linear;
}

/* ══ Toast ══ */
.toast {
  position: fixed; bottom: calc(16px + var(--safe-bottom)); left: 50%;
  -webkit-transform: translateX(-50%) translateY(14px); transform: translateX(-50%) translateY(14px);
  background: #111; border: 2px solid #444; border-radius: 14px; padding: 10px 22px;
  font-size: 16px; font-weight: 700; color: #fff;
  z-index: 999; opacity: 0; pointer-events: none; white-space: nowrap;
  -webkit-transition: opacity .2s, -webkit-transform .2s; transition: opacity .2s, transform .2s;
}
.toast.show { opacity:1; -webkit-transform:translateX(-50%) translateY(0); transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 左側 1/3 -->
<div class="left-panel">

  <!-- 麵種 -->
  <div class="group">
    <div class="group-label">麵　種</div>
    <div class="btn-row">
      <button type="button" class="sel-btn" id="bn-油麵"   onclick="toggle('noodle','油麵')">油麵</button>
      <button type="button" class="sel-btn" id="bn-粗陽春" onclick="toggle('noodle','粗陽春')">粗陽春</button>
      <button type="button" class="sel-btn" id="bn-細陽春" onclick="toggle('noodle','細陽春')">細陽春</button>
      <button type="button" class="sel-btn" id="bn-米粉"   onclick="toggle('noodle','米粉')">米粉</button>
      <button type="button" class="sel-btn" id="bn-冬粉"   onclick="toggle('noodle','冬粉')">冬粉</button>
    </div>
  </div>

  <div class="group-divider"></div>

  <!-- 配料 -->
  <div class="group">
    <div class="group-label">配　料</div>
    <div class="btn-row" style="min-height:72px;">
      <button type="button" class="sel-btn" id="bt-肉羹" onclick="toggle('topping','肉羹')">肉羹</button>
      <button type="button" class="sel-btn" id="bt-花枝" onclick="toggle('topping','花枝')">花枝</button>
      <button type="button" class="sel-btn" id="bt-魚酥" onclick="toggle('topping','魚酥')">魚酥</button>
      <button type="button" class="sel-btn" id="bt-魷魚" onclick="toggle('topping','魷魚')">魷魚</button>
    </div>
  </div>

  <div class="group-divider"></div>

  <!-- 湯種 -->
  <div class="group">
    <div class="group-label">湯　種</div>
    <div class="btn-row" style="min-height:72px;">
      <button type="button" class="sel-btn" id="bs-乾"   onclick="toggle('soup','乾')">乾</button>
      <button type="button" class="sel-btn" id="bs-羹湯" onclick="toggle('soup','羹湯')">羹湯</button>
      <button type="button" class="sel-btn" id="bs-清湯" onclick="toggle('soup','清湯')">清湯</button>
    </div>
  </div>

  <div class="group-divider"></div>

  <!-- 大小 -->
  <div class="group">
    <div class="group-label">大　小</div>
    <div class="btn-row">
      <button type="button" class="sel-btn" id="bz-大碗" onclick="toggle('size','大碗')" style="writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;height:48px;">大碗</button>
      <button type="button" class="sel-btn" id="bz-小碗" onclick="toggle('size','小碗')" style="writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;height:48px;">小碗</button>
    </div>
  </div>

  <!-- 內外 -->
  <div class="group">
    <div class="group-label">內外帶</div>
    <div class="btn-row">
      <button type="button" class="sel-btn" id="bp-內用" onclick="toggle('place','內用')" style="writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;height:48px;">內用</button>
      <button type="button" class="sel-btn" id="bp-外帶" onclick="toggle('place','外帶')" style="writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;height:48px;">外帶</button>
    </div>
  </div>

  <!-- 數量 -->
  <div class="group">
    <div class="group-label">數　量</div>
    <div class="btn-row" style="min-height:48px;">
      <button type="button" class="sel-btn" id="bq-1" onclick="toggle('qty','1')" style="writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;height:48px;">1</button>
      <button type="button" class="sel-btn" id="bq-2" onclick="toggle('qty','2')" style="writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;height:48px;">2</button>
      <button type="button" class="sel-btn" id="bq-3" onclick="toggle('qty','3')" style="writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;height:48px;">3</button>
      <button type="button" class="sel-btn" id="bq-4" onclick="toggle('qty','4')" style="writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;height:48px;">4</button>
      <button type="button" class="sel-btn" id="bq-5" onclick="toggle('qty','5')" style="writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;height:48px;">5</button>
      <button type="button" class="sel-btn" id="bq-6" onclick="toggle('qty','6')" style="writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;height:48px;">6</button>
      <button type="button" class="sel-btn" id="bq-7" onclick="toggle('qty','7')" style="writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;height:48px;">7</button>
      <button type="button" class="sel-btn" id="bq-8" onclick="toggle('qty','8')" style="writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;height:48px;">8</button>
      <button type="button" class="sel-btn" id="bq-9" onclick="toggle('qty','9')" style="writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;height:48px;">9</button>
    </div>
  </div>

  <div style="min-height:2px;"></div>

  <button type="button" class="submit-btn" id="submitBtn" onclick="submitOrder()">送出</button>
</div>

<!-- 右側 2/3 -->
<div class="right-panel">
  <div class="board-header">
    <div class="board-title">🍜 煮麵清單</div>
    <div class="pending-badge">待煮 <b id="pendingCount">0</b> 份</div>
  </div>
  <div class="board" id="board">
    <div class="board-empty" id="boardEmpty">
      <div class="ei">🫕</div>
      <div class="et">左側選好後按送出</div>
    </div>
  </div>
</div>

<div class="reset-corner" id="resetCorner">
  <svg width="50" height="50" viewBox="0 0 50 50"><circle cx="25" cy="25" r="23"/></svg>
  🗑
</div>
<div class="toast" id="toast"></div>

<script>
var NOODLE_COLORS = {
  '油麵':  {bg:'#F5C518', text:'#1a1000'},
  '粗陽春':{bg:'#F0F0F0', text:'#111'},
  '細陽春':{bg:'#A8D8F0', text:'#0a2a40'},
  '米粉':  {bg:'#C8A0E8', text:'#1a0030'},
  '冬粉':  {bg:'#7ED98A', text:'#082210'},
};

var sel = { noodle:null, topping:null, soup:null, size:null, place:null, qty:null };
var tiles = load();
var seq = tiles.length ? Math.max.apply(null, tiles.map(function(t){ return t.s||0; })) : 0;

/* ── Audio ── */
var _ctx=null;
function actx(){
  if(!_ctx) _ctx=new(window.AudioContext||window.webkitAudioContext)();
  if(_ctx.state==='suspended') _ctx.resume();
  return _ctx;
}
function beep(type){
  try{
    var c=actx();
    var pairs=type==='add'?[[440,0],[660,0.1]]:[[660,0],[440,0.1]];
    pairs.forEach(function(p){
      var o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.frequency.value=p[0];
      var t=c.currentTime+p[1];
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.2,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
      o.start(t);o.stop(t+0.22);
    });
  }catch(e){}
}

function load(){ try{return JSON.parse(localStorage.getItem('nm10')||'[]');}catch(e){return[];} }
function save(){ try{localStorage.setItem('nm10',JSON.stringify(tiles));}catch(e){} }

/* ── Toggle ── */
var PREFIX = { noodle:'bn-', topping:'bt-', soup:'bs-', size:'bz-', place:'bp-', qty:'bq-' };
var CLASS  = { noodle:'on-noodle', topping:'on-topping', soup:'on-soup', size:'on-size', place:'on-place', qty:'on-size' };

function toggle(key, val) {
  actx();
  /* 同群組只能選一個，再按同一個取消 */
  var prev = sel[key];
  sel[key] = (prev === val) ? null : val;

  /* 更新上一個選中的按鈕 */
  if (prev) {
    var old = document.getElementById(PREFIX[key]+prev);
    if (old) old.className = 'sel-btn';
  }
  /* 更新新選中的按鈕 */
  if (sel[key]) {
    var el = document.getElementById(PREFIX[key]+sel[key]);
    if (el) el.className = 'sel-btn ' + CLASS[key];
  }
  updateSubmit();
}

function updateSubmit() {
  var btn = document.getElementById('submitBtn');
  btn.className = sel.noodle ? 'submit-btn ready' : 'submit-btn';
}

/* ── 送出 ── */
function submitOrder() {
  if (!sel.noodle) return;
  seq++;
  var t = {
    id: Date.now().toString(36)+(seq%999),
    s: seq,
    noodle:  sel.noodle,
    topping: sel.topping,
    soup:    sel.soup,
    size:    sel.size,
    place:   sel.place,
    qty:     sel.qty,
  };
  tiles.push(t);
  save();
  addRowToDOM(t);
  updateCounts();
  beep('add');

  /* 清空所有選擇 */
  Object.keys(sel).forEach(function(k){
    if (sel[k]) {
      var el = document.getElementById(PREFIX[k]+sel[k]);
      if (el) el.className = 'sel-btn';
    }
    sel[k] = null;
  });
  updateSubmit();
}

function updateCounts() {
  document.getElementById('pendingCount').textContent = tiles.length;
}

/* ── 加入清單 ── */
function addRowToDOM(t) {
  var board = document.getElementById('board');
  document.getElementById('boardEmpty').style.display = 'none';

  var nc = NOODLE_COLORS[t.noodle] || {bg:'#888', text:'#fff'};

  var row = document.createElement('div');
  row.className = 'order-row'; row.id = 'row-'+t.id;

  var bar = document.createElement('div');
  bar.className = 'row-bar'; bar.style.background = nc.bg;

  var body = document.createElement('div');
  body.className = 'row-body';

  var html = '<span class="row-tag rt-noodle" style="background:'+nc.bg+';color:'+nc.text+'">'+t.noodle+'</span>';
  if (t.topping) html += '<span class="row-tag rt-topping">'+t.topping+'</span>';
  if (t.soup)    html += '<span class="row-tag rt-soup">'+t.soup+'</span>';
  if (t.size)    html += '<span class="row-tag rt-size">'+t.size+'</span>';
  if (t.place)   html += '<span class="row-tag rt-place">'+t.place+'</span>';
  if (t.qty)     html += '<span class="row-tag rt-size">'+t.qty+'份</span>';
  body.innerHTML = html;

  row.appendChild(bar); row.appendChild(body);
  row.onclick = (function(id){ return function(){ removeRow(id); }; })(t.id);
  board.insertBefore(row, board.firstChild);
}

/* ── 移除列 ── */
function removeRow(id) {
  var el = document.getElementById('row-'+id);
  if (!el) return;
  beep('done');
  el.classList.add('removing'); el.onclick = null;
  setTimeout(function(){
    tiles = tiles.filter(function(t){ return t.id!==id; });
    save();
    if (el.parentNode) el.parentNode.removeChild(el);
    if (!tiles.length) {
      var board=document.getElementById('board'), empty=document.getElementById('boardEmpty');
      board.innerHTML=''; board.appendChild(empty); empty.style.display='flex';
    }
    updateCounts();
  }, 220);
}

/* ── Reset ── */
var pressTimer=null, pressingReset=false;
function resetStart(e) {
  e.preventDefault(); if(pressingReset)return; pressingReset=true;
  document.getElementById('resetCorner').classList.add('pressing');
  pressTimer=setTimeout(doReset,3000);
}
function resetEnd() {
  if(!pressingReset)return; pressingReset=false;
  clearTimeout(pressTimer);
  document.getElementById('resetCorner').classList.remove('pressing');
}
function doReset() {
  pressingReset=false;
  document.getElementById('resetCorner').classList.remove('pressing');
  if(!tiles.length){showToast('目前沒有訂單');return;}
  tiles=[];save();
  var board=document.getElementById('board'),empty=document.getElementById('boardEmpty');
  board.innerHTML='';board.appendChild(empty);empty.style.display='flex';
  updateCounts();showToast('已清除所有訂單');
}

function showToast(msg) {
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); },2000);
}

/* ── Restore ── */
function restore() {
  if(!tiles.length)return;
  tiles.slice().sort(function(a,b){return (a.s||0)-(b.s||0);})
    .forEach(function(t){addRowToDOM(t);});
  updateCounts();
}

/* ── Wake Lock ── */
function wakeLock(){
  if('wakeLock'in navigator) navigator.wakeLock.request('screen').catch(function(){});
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible') wakeLock();
});

var rc=document.getElementById('resetCorner');
rc.addEventListener('touchstart',resetStart,{passive:false});
