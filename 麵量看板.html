<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="煮麵看板">
<title>煮麵看板</title>
<style>
:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
html { height: 100%; overflow: hidden; position: fixed; width: 100%; }
body {
  height: 100%; width: 100%;
  display: -webkit-flex; display: flex;
  background: #0a0a0a;
  font-family: -apple-system, '蘋方-繁', 'PingFang TC', sans-serif;
  color: #fff;
  padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
  padding-left: var(--safe-left); padding-right: var(--safe-right);
}

/* ══ 左側 40% ══ */
.left {
  width: 40%; -webkit-flex-shrink: 0; flex-shrink: 0;
  background: #141414; border-right: 2px solid #333;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  padding: 8px; gap: 5px; overflow: hidden;
}
.row-label {
  font-size: 13px; font-weight: 700; color: #666;
  letter-spacing: 3px; padding: 0 2px;
  -webkit-flex-shrink: 0; flex-shrink: 0;
}
.btn-row {
  display: -webkit-flex; display: flex;
  gap: 5px; -webkit-flex-shrink: 0; flex-shrink: 0;
}
.sep { height: 1px; background: #252525; -webkit-flex-shrink: 0; flex-shrink: 0; }

/* ══ 選項按鈕 ══ */
.sb {
  -webkit-flex: 1; flex: 1; height: 54px;
  border-radius: 10px; border: 2px solid #3a3a3a;
  background: #2a2a2a; color: #ccc;
  font-size: 30px; font-weight: 900;
  cursor: pointer; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-appearance: none; appearance: none;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  -webkit-transition: all .1s; transition: all .1s;
  white-space: nowrap;
}
.sb:active { opacity: 0.6; }
.sb.on-n { background: #e0b800; color: #111; border: 3px solid #fff; }
.sb.on-t { background: #E8503A; color: #fff; border: 3px solid #fff; }
.sb.on-s { background: #3a80c0; color: #fff; border: 3px solid #fff; }
.sb.on-z { background: #c09030; color: #fff; border: 3px solid #fff; }
.sb.on-p { background: #309060; color: #fff; border: 3px solid #fff; }
.sb.on-q { background: #8040c0; color: #fff; border: 3px solid #fff; }

/* ══ 倒數預覽區 ══ */
.preview-bar {
  -webkit-flex-shrink: 0; flex-shrink: 0;
  background: #1e1e1e; border-radius: 12px;
  border: 2px solid #333;
  overflow: hidden; display: none;
}
.preview-bar.show { display: block; }
.preview-content {
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  padding: 8px 12px; gap: 10px;
}
.preview-tags {
  -webkit-flex: 1; flex: 1;
  display: -webkit-flex; display: flex;
  -webkit-flex-wrap: wrap; flex-wrap: wrap;
  gap: 5px;
}
.preview-tag {
  font-size: 20px; font-weight: 900;
  padding: 2px 10px; border-radius: 6px;
}
.cancel-btn {
  -webkit-flex-shrink: 0; flex-shrink: 0;
  height: 44px; padding: 0 16px;
  border-radius: 8px; border: 1px solid #555;
  background: #333; color: #ccc;
  font-size: 18px; font-weight: 700;
  cursor: pointer; touch-action: manipulation;
  -webkit-appearance: none; appearance: none;
}
.cancel-btn:active { background: #444; }

/* 進度條 */
.progress-track {
  height: 5px; background: #333;
}
.progress-fill {
  height: 100%; background: #e8a000;
  width: 100%;
  -webkit-transition: width 3s linear; transition: width 3s linear;
}
.progress-fill.running { width: 0%; }

/* ══ 右側 ══ */
.right {
  -webkit-flex: 1; flex: 1;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  overflow: hidden; background: #0a0a0a;
}
.board-header {
  padding: 10px 16px; background: #111; border-bottom: 2px solid #1e1e1e;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-flex-shrink: 0; flex-shrink: 0;
}
.board-title { font-size: 18px; font-weight: 900; }
.pending-badge { font-size: 14px; color: #888; }
.pending-badge b { color: #fff; font-size: 22px; font-weight: 900; }

.board {
  -webkit-flex: 1; flex: 1;
  overflow-y: scroll; -webkit-overflow-scrolling: touch;
  padding: 10px 12px 60px;
}
.board-empty {
  height: 100%; display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  gap: 10px; opacity: 0.2; pointer-events: none;
}
.board-empty .ei { font-size: 52px; }
.board-empty .et { font-size: 16px; font-weight: 700; color: #666; }

/* ══ 訂單列（右滑刪除）══ */
.row-wrapper {
  position: relative; margin-bottom: 8px;
  border-radius: 14px; overflow: hidden;
  -webkit-animation: row-in .2s cubic-bezier(.34,1.56,.64,1) both;
  animation: row-in .2s cubic-bezier(.34,1.56,.64,1) both;
}
@-webkit-keyframes row-in {
  from { opacity:0; -webkit-transform:translateX(20px); }
  to   { opacity:1; -webkit-transform:translateX(0); }
}
@keyframes row-in {
  from { opacity:0; transform:translateX(20px); }
  to   { opacity:1; transform:translateX(0); }
}
.row-wrapper.removing {
  -webkit-animation: row-out .22s ease-in forwards !important;
  animation: row-out .22s ease-in forwards !important;
}
@-webkit-keyframes row-out {
  from { opacity:1; max-height:120px; margin-bottom:8px; }
  to   { opacity:0; max-height:0;     margin-bottom:0; }
}
@keyframes row-out {
  from { opacity:1; max-height:120px; margin-bottom:8px; }
  to   { opacity:0; max-height:0;     margin-bottom:0; }
}

/* 右滑刪除提示底層 */
.row-delete-hint {
  position: absolute; top:0; right:0; bottom:0;
  width: 100%; background: #c0392b;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: flex-end; justify-content: flex-end;
  padding-right: 24px;
  font-size: 22px; font-weight: 900; color: #fff;
  border-radius: 14px;
  opacity: 0;
  -webkit-transition: opacity .15s; transition: opacity .15s;
}
.row-delete-hint.show { opacity: 1; }

.order-row {
  position: relative; z-index: 1;
  display: -webkit-flex; display: flex;
  -webkit-align-items: stretch; align-items: stretch;
  min-height: 62px;
  border-radius: 14px; overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  touch-action: pan-y;
  background: #1c1c1c;
  -webkit-transition: -webkit-transform .15s; transition: transform .15s;
  will-change: transform;
}

.row-bar { width: 12px; -webkit-flex-shrink: 0; flex-shrink: 0; }
.row-body {
  -webkit-flex: 1; flex: 1;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  padding: 6px 14px; gap: 8px;
  -webkit-flex-wrap: wrap; flex-wrap: wrap;
}
.tag {
  font-size: 27px; font-weight: 900;
  padding: 3px 12px; border-radius: 8px; white-space: nowrap;
}
.tn { background: #2a1f00; color: #e0b800; }
.tt { background: #2a0a00; color: #ff7050; }
.ts { background: #0a2040; color: #60b0f0; }
.tz { background: #2a1800; color: #d09030; }
.tp { background: #0a2010; color: #50c070; }
.tq { background: #1a0a28; color: #b070e0; }
.row-time { font-size: 13px; color: #555; margin-left: auto; white-space: nowrap; padding-left: 8px; }

/* ══ Reset ══ */
.reset-corner {
  position: fixed; bottom: calc(14px + var(--safe-bottom)); right: calc(14px + var(--safe-right));
  width: 50px; height: 50px; border-radius: 50%;
  border: 2px solid #2a2a2a; background: #181818; color: #444; font-size: 18px;
  cursor: pointer;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: none; z-index: 100;
}
.reset-corner.pressing { border-color: #ff5555; background: #2a1010; color: #ff5555; }
.reset-corner svg { position: absolute; top:0; left:0;
  -webkit-transform: rotate(-90deg); transform: rotate(-90deg); pointer-events: none; }
.reset-corner circle {
  fill: none; stroke: #ff5555; stroke-width: 3;
  stroke-dasharray: 145; stroke-dashoffset: 145; stroke-linecap: round;
  -webkit-transition: none; transition: none;
}
.reset-corner.pressing circle {
  stroke-dashoffset: 0;
  -webkit-transition: stroke-dashoffset 3s linear; transition: stroke-dashoffset 3s linear;
}
.toast {
  position: fixed; bottom: calc(16px + var(--safe-bottom)); left: 50%;
  -webkit-transform: translateX(-50%) translateY(14px); transform: translateX(-50%) translateY(14px);
  background: #111; border: 2px solid #444; border-radius: 14px; padding: 10px 22px;
  font-size: 16px; font-weight: 700; color: #fff;
  z-index: 999; opacity: 0; pointer-events: none; white-space: nowrap;
  -webkit-transition: opacity .2s, -webkit-transform .2s; transition: opacity .2s, transform .2s;
}
.toast.show { opacity:1; -webkit-transform:translateX(-50%) translateY(0); transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 左側 -->
<div class="left">

  <div class="row-label">麵　種</div>
  <div class="btn-row">
    <button class="sb" id="bn-油麵"   onclick="tog('n','油麵')"   style="writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;height:auto;min-height:80px;">油麵</button>
    <button class="sb" id="bn-粗陽春" onclick="tog('n','粗陽春')" style="writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;height:auto;min-height:80px;">粗陽春</button>
    <button class="sb" id="bn-細陽春" onclick="tog('n','細陽春')" style="writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;height:auto;min-height:80px;">細陽春</button>
    <button class="sb" id="bn-米粉"   onclick="tog('n','米粉')"   style="writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;height:auto;min-height:80px;">米粉</button>
    <button class="sb" id="bn-冬粉"   onclick="tog('n','冬粉')"   style="writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;height:auto;min-height:80px;">冬粉</button>
  </div>

  <div class="sep"></div>

  <div class="row-label">配　料</div>
  <div class="btn-row">
    <button class="sb" id="bt-肉羹" onclick="tog('t','肉羹')" style="writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;height:auto;min-height:72px;">肉羹</button>
    <button class="sb" id="bt-花枝" onclick="tog('t','花枝')" style="writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;height:auto;min-height:72px;">花枝</button>
    <button class="sb" id="bt-魚酥" onclick="tog('t','魚酥')" style="writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;height:auto;min-height:72px;">魚酥</button>
    <button class="sb" id="bt-魷魚" onclick="tog('t','魷魚')" style="writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;height:auto;min-height:72px;">魷魚</button>
    <button class="sb" id="bt-蘿蔔" onclick="tog('t','蘿蔔')" style="writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;height:auto;min-height:72px;">蘿蔔</button>
    <button class="sb" id="bt-綜合" onclick="tog('t','綜合')" style="writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;height:auto;min-height:72px;">綜合</button>
  </div>

  <div class="sep"></div>

  <div class="row-label">湯　種</div>
  <div class="btn-row">
    <button class="sb" id="bs-乾"   onclick="tog('s','乾')">乾</button>
    <button class="sb" id="bs-羹湯" onclick="tog('s','羹湯')">羹湯</button>
    <button class="sb" id="bs-清湯" onclick="tog('s','清湯')">清湯</button>
  </div>

  <div class="sep"></div>

  <div class="row-label">大小・內外</div>
  <div class="btn-row">
    <button class="sb" id="bz-大碗" onclick="tog('z','大碗')">大碗</button>
    <button class="sb" id="bz-小碗" onclick="tog('z','小碗')">小碗</button>
    <button class="sb" id="bp-內用" onclick="tog('p','內用')">內用</button>
    <button class="sb" id="bp-外帶" onclick="tog('p','外帶')">外帶</button>
  </div>

  <div class="sep"></div>

  <div class="row-label">數　量</div>
  <div class="btn-row">
    <button class="sb" id="bq-1" onclick="tog('q','1')">1</button>
    <button class="sb" id="bq-2" onclick="tog('q','2')">2</button>
    <button class="sb" id="bq-3" onclick="tog('q','3')">3</button>
    <button class="sb" id="bq-4" onclick="tog('q','4')">4</button>
    <button class="sb" id="bq-5" onclick="tog('q','5')">5</button>
    <button class="sb" id="bq-6" onclick="tog('q','6')">6</button>
    <button class="sb" id="bq-7" onclick="tog('q','7')">7</button>
    <button class="sb" id="bq-8" onclick="tog('q','8')">8</button>
    <button class="sb" id="bq-9" onclick="tog('q','9')">9</button>
  </div>

  <!-- 倒數預覽區 -->
  <div class="preview-bar" id="previewBar">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="preview-content">
      <div class="preview-tags" id="previewTags"></div>
      <button class="cancel-btn" onclick="cancelOrder()">取消</button>
    </div>
  </div>

</div>

<!-- 右側 -->
<div class="right">
  <div class="board-header">
    <div class="board-title">🍜 煮麵清單</div>
    <div class="pending-badge">待煮 <b id="pendingCount">0</b> 份</div>
  </div>
  <div class="board" id="board">
    <div class="board-empty" id="boardEmpty">
      <div class="ei">🫕</div>
      <div class="et">左側選好，3秒後自動送出</div>
    </div>
  </div>
</div>

<div class="reset-corner" id="resetCorner">
  <svg width="50" height="50" viewBox="0 0 50 50"><circle cx="25" cy="25" r="23"/></svg>🗑
</div>
<div class="toast" id="toast"></div>

<script>
var NC = {
  '油麵':  {bg:'#e0b800',text:'#111'},
  '粗陽春':{bg:'#e8e8e8',text:'#111'},
  '細陽春':{bg:'#90c8f0',text:'#0a2040'},
  '米粉':  {bg:'#c0a0e8',text:'#1a0030'},
  '冬粉':  {bg:'#70d080',text:'#082210'},
};
var GC = { n:'on-n', t:'on-t', s:'on-s', z:'on-z', p:'on-p', q:'on-q' };
var GP = { n:'bn-', t:'bt-', s:'bs-', z:'bz-', p:'bp-', q:'bq-' };

var sel = { n:null, t:null, s:null, z:null, p:null, q:null };
var tiles = load();
var seq = tiles.length ? Math.max.apply(null, tiles.map(function(t){return t.s||0;})) : 0;

/* ── 倒數狀態 ── */
var countdownTimer = null;
var isCountingDown = false;

/* ── Audio ── */
var _ctx=null;
function actx(){
  if(!_ctx) _ctx=new(window.AudioContext||window.webkitAudioContext)();
  if(_ctx.state==='suspended') _ctx.resume();
  return _ctx;
}
function beep(type){
  try{
    var c=actx();
    var pairs=type==='add'?[[440,0],[660,0.1]]:[[660,0],[440,0.1]];
    pairs.forEach(function(p){
      var o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.frequency.value=p[0];
      var t=c.currentTime+p[1];
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.2,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
      o.start(t);o.stop(t+0.22);
    });
  }catch(e){}
}

function load(){ try{return JSON.parse(localStorage.getItem('nm12')||'[]');}catch(e){return[];} }
function save(){ try{localStorage.setItem('nm12',JSON.stringify(tiles));}catch(e){} }

/* ── Toggle ── */
function tog(grp, val){
  actx();
  var prev = sel[grp];
  if(prev){
    var old=document.getElementById(GP[grp]+prev);
    if(old) old.className='sb';
  }
  if(prev===val){ sel[grp]=null; }
  else { sel[grp]=val; var el=document.getElementById(GP[grp]+val); if(el) el.className='sb '+GC[grp]; }
  
  var hasAny = Object.keys(sel).some(function(k){ return sel[k]!==null; });
  if(hasAny) startCountdown();
  else cancelOrder();
}

/* ══ 項目一：3秒倒數自動送出 ══ */
function startCountdown(){
  /* 重置並重啟倒數（每次改選項都重新計時） */
  clearTimeout(countdownTimer);
  isCountingDown = true;

  /* 更新預覽標籤 */
  updatePreview();

  /* 顯示預覽區 */
  document.getElementById('previewBar').classList.add('show');

  /* 進度條動畫：先重設為100%，下一幀再跑到0% */
  var fill = document.getElementById('progressFill');
  fill.style.webkitTransition = 'none';
  fill.style.transition = 'none';
  fill.style.width = '100%';
  setTimeout(function(){
    fill.style.webkitTransition = 'width 3s linear';
    fill.style.transition = 'width 3s linear';
    fill.style.width = '0%';
  }, 30);

  /* 3秒後送出 */
  countdownTimer = setTimeout(function(){
    if(isCountingDown) commitOrder();
  }, 3000);
}

function updatePreview(){
  var tags = document.getElementById('previewTags');
  var html = '';
  if(sel.n){ var nc=NC[sel.n]||{bg:'#888',text:'#fff'}; html+='<span class="preview-tag" style="background:'+nc.bg+';color:'+nc.text+'">'+sel.n+'</span>'; }
  if(sel.t) html+='<span class="preview-tag" style="background:#2a0a00;color:#ff7050">'+sel.t+'</span>';
  if(sel.s) html+='<span class="preview-tag" style="background:#0a2040;color:#60b0f0">'+sel.s+'</span>';
  if(sel.z) html+='<span class="preview-tag" style="background:#2a1800;color:#d09030">'+sel.z+'</span>';
  if(sel.p) html+='<span class="preview-tag" style="background:#0a2010;color:#50c070">'+sel.p+'</span>';
  if(sel.q) html+='<span class="preview-tag" style="background:#1a0a28;color:#b070e0">'+sel.q+'份</span>';
  tags.innerHTML = html;
}

function cancelOrder(){
  clearTimeout(countdownTimer);
  isCountingDown = false;
  document.getElementById('previewBar').classList.remove('show');
  /* 清空所有選擇 */
  Object.keys(sel).forEach(function(k){
    if(sel[k]){
      var el=document.getElementById(GP[k]+sel[k]);
      if(el) el.className='sb';
    }
    sel[k]=null;
  });
}

function commitOrder(){
  isCountingDown = false;
  document.getElementById('previewBar').classList.remove('show');

  seq++;
  var t={
    id:Date.now().toString(36)+(seq%999), s:seq,
    n:sel.n, t:sel.t, s2:sel.s, z:sel.z, p:sel.p, q:sel.q,
    ts: Date.now()
  };
  tiles.push(t); save();
  addRow(t); updateCount(); beep('add');

  /* 清空選擇 */
  Object.keys(sel).forEach(function(k){
    if(sel[k]){
      var el=document.getElementById(GP[k]+sel[k]);
      if(el) el.className='sb';
    }
    sel[k]=null;
  });
}

function updateCount(){
  document.getElementById('pendingCount').textContent=tiles.length;
}

/* ══ 項目三：時間戳 ══ */
function timeAgo(ts){
  var diff = Math.floor((Date.now()-ts)/1000);
  if(diff < 60) return diff+'秒前';
  return Math.floor(diff/60)+'分前';
}

/* 每30秒更新一次時間戳 */
setInterval(function(){
  var els = document.querySelectorAll('.row-time');
  for(var i=0;i<els.length;i++){
    var ts = parseInt(els[i].getAttribute('data-ts'),10);
    if(ts) els[i].textContent = timeAgo(ts);
  }
}, 30000);

/* ── 加入清單 ── */
function addRow(t){
  var board=document.getElementById('board');
  document.getElementById('boardEmpty').style.display='none';

  var nc = t.n ? (NC[t.n]||{bg:'#888',text:'#fff'}) : {bg:'#555',text:'#fff'};

  var wrapper=document.createElement('div');
  wrapper.className='row-wrapper'; wrapper.id='wrap-'+t.id;

  /* 刪除提示底層 */
  var hint=document.createElement('div');
  hint.className='row-delete-hint';
  hint.textContent='煮好了 ✓';

  var row=document.createElement('div');
  row.className='order-row'; row.id='row-'+t.id;

  var bar=document.createElement('div');
  bar.className='row-bar'; bar.style.background=nc.bg;

  var body=document.createElement('div');
  body.className='row-body';

  var html='';
  if(t.n)  html+='<span class="tag tn" style="background:'+nc.bg+';color:'+nc.text+'">'+t.n+'</span>';
  if(t.t)  html+='<span class="tag tt">'+t.t+'</span>';
  if(t.s2) html+='<span class="tag ts">'+t.s2+'</span>';
  if(t.z)  html+='<span class="tag tz">'+t.z+'</span>';
  if(t.p)  html+='<span class="tag tp">'+t.p+'</span>';
  if(t.q)  html+='<span class="tag tq">'+t.q+'份</span>';
  if(!html)html+='<span class="tag" style="background:#333;color:#aaa">（無備註）</span>';
  html+='<span class="row-time" data-ts="'+(t.ts||Date.now())+'">'+(t.ts?timeAgo(t.ts):'')+'</span>';

  body.innerHTML=html;
  row.appendChild(bar); row.appendChild(body);

  /* ══ 項目二：右滑刪除 ══ */
  attachSwipe(wrapper, hint, row, t.id);

  wrapper.appendChild(hint);
  wrapper.appendChild(row);
  board.insertBefore(wrapper, board.firstChild);
}

/* ── 右滑刪除邏輯 ── */
function attachSwipe(wrapper, hint, row, id){
  var startX=0, startY=0, dx=0;
  var swiping=false, committed=false;
  var THRESHOLD = 80; /* px，滑超過這個距離才刪除 */

  function onStart(e){
    if(committed) return;
    var touch = e.touches ? e.touches[0] : e;
    startX = touch.clientX; startY = touch.clientY;
    dx=0; swiping=false;
    row.style.webkitTransition='none'; row.style.transition='none';
  }
  function onMove(e){
    if(committed) return;
    var touch = e.touches ? e.touches[0] : e;
    var cx=touch.clientX, cy=touch.clientY;
    var mx=cx-startX, my=cy-startY;
    /* 先判斷是橫滑還是直滑 */
    if(!swiping && Math.abs(mx)<5 && Math.abs(my)<5) return;
    if(!swiping){
      if(Math.abs(my)>Math.abs(mx)){ return; } /* 直滑：讓捲軸處理 */
      swiping=true;
    }
    dx = Math.max(0, mx); /* 只允許向右滑 */
    row.style.webkitTransform='translateX('+dx+'px)';
    row.style.transform='translateX('+dx+'px)';
    var ratio = Math.min(dx/THRESHOLD, 1);
    hint.style.opacity = ratio;
    if(e.cancelable) e.preventDefault();
  }
  function onEnd(e){
    if(committed) return;
    if(!swiping){ dx=0; return; }
    swiping=false;
    if(dx >= THRESHOLD){
      committed=true;
      /* 滑過門檻：確認刪除 */
      row.style.webkitTransition='-webkit-transform .15s ease-out';
      row.style.transition='transform .15s ease-out';
      row.style.webkitTransform='translateX(100%)';
      row.style.transform='translateX(100%)';
      hint.style.opacity='1';
      setTimeout(function(){ removeRow(id); }, 160);
    } else {
      /* 沒滑夠：彈回 */
      row.style.webkitTransition='-webkit-transform .2s ease-out';
      row.style.transition='transform .2s ease-out';
      row.style.webkitTransform='translateX(0)';
      row.style.transform='translateX(0)';
      hint.style.opacity='0';
      dx=0;
    }
  }

  row.addEventListener('touchstart', onStart, {passive:true});
  row.addEventListener('touchmove',  onMove,  {passive:false});
  row.addEventListener('touchend',   onEnd,   {passive:true});
  row.addEventListener('mousedown',  onStart, false);
  window.addEventListener('mousemove', function(e){ if(startX&&swiping) onMove(e); }, false);
  window.addEventListener('mouseup',   function(e){ if(swiping) onEnd(e); },         false);
}

/* ── 移除列 ── */
function removeRow(id){
  beep('done');
  tiles=tiles.filter(function(t){return t.id!==id;});
  save();
  var wrapper=document.getElementById('wrap-'+id);
  if(wrapper){ wrapper.classList.add('removing'); setTimeout(function(){if(wrapper.parentNode)wrapper.parentNode.removeChild(wrapper);},240); }
  if(!tiles.length){
    setTimeout(function(){
      var board=document.getElementById('board'),empty=document.getElementById('boardEmpty');
      board.innerHTML=''; board.appendChild(empty); empty.style.display='flex';
    },250);
  }
  updateCount();
}

/* ── Reset ── */
var pt=null,pr=false;
function resetStart(e){
  e.preventDefault(); if(pr)return; pr=true;
  document.getElementById('resetCorner').classList.add('pressing');
  pt=setTimeout(doReset,3000);
}
function resetEnd(){
  if(!pr)return; pr=false; clearTimeout(pt);
  document.getElementById('resetCorner').classList.remove('pressing');
}
function doReset(){
  pr=false; document.getElementById('resetCorner').classList.remove('pressing');
  if(!tiles.length){showToast('目前沒有訂單');return;}
  tiles=[];save();
  var board=document.getElementById('board'),empty=document.getElementById('boardEmpty');
  board.innerHTML=''; board.appendChild(empty); empty.style.display='flex';
  updateCount(); showToast('已清除所有訂單');
}

function showToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2000);
}

/* ── Restore ── */
function restore(){
  if(!tiles.length)return;
  tiles.slice().sort(function(a,b){return (a.s||0)-(b.s||0);})
    .forEach(function(t){addRow(t);});
  updateCount();
}

/* ── Wake Lock ── */
function wakeLock(){
  if('wakeLock'in navigator) navigator.wakeLock.request('screen').catch(function(){});
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible') wakeLock();
});

var rc=document.getElementById('resetCorner');
rc.addEventListener('touchstart',resetStart,{passive:false});
rc.addEventListener('touchend',  resetEnd,  false);
rc.addEventListener('touchcancel',resetEnd, false);
rc.addEventListener('mousedown', resetStart,false);
rc.addEventListener('mouseup',   resetEnd,  false);
rc.addEventListener('mouseleave',resetEnd,  false);

restore(); wakeLock();
</script>
