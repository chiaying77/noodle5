<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="煮麵看板">
<title>煮麵看板</title>
<style>
:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
html { height: 100%; overflow: hidden; position: fixed; width: 100%; }
body {
  height: 100%; width: 100%;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: row; flex-direction: row;
  background: #0a0a0a;
  font-family: -apple-system, '蘋方-繁', 'PingFang TC', sans-serif;
  color: #fff;
  padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
  padding-left: var(--safe-left); padding-right: var(--safe-right);
}

/* ══════════════════════════
   第一欄：麵種
══════════════════════════ */
.col-noodle {
  width: 150px; -webkit-flex-shrink: 0; flex-shrink: 0;
  background: #141414;
  border-right: 2px solid #2a2a2a;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  overflow: hidden;
  padding: 6px 6px;
  gap: 5px;
}
.noodle-btn {
  width: 100%; height: 56px;
  border-radius: 12px; border: none;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  cursor: pointer; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-appearance: none; appearance: none;
  outline: 4px solid transparent; outline-offset: 2px;
  -webkit-transition: outline-color .1s; transition: outline-color .1s;
  position: relative;
}
.noodle-btn.selected { outline-color: #fff; }
.noodle-btn:active { opacity: 0.6; }
.noodle-btn-name { font-size: 35px; font-weight: 900; }
.noodle-btn-cnt {
  position: absolute; top: 4px; right: 6px;
  font-size: 14px; font-weight: 900;
  background: rgba(0,0,0,0.3); border-radius: 8px; padding: 1px 6px;
  display: none;
}
.noodle-btn-cnt.show { display: block; }

/* ══════════════════════════
   第二欄：細節選項
══════════════════════════ */
.col-opts {
  width: 150px; -webkit-flex-shrink: 0; flex-shrink: 0;
  background: #111;
  border-right: 2px solid #2a2a2a;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  padding: 8px 8px;
  gap: 6px;
  overflow-y: auto;
}

.opt-group-label {
  font-size: 12px; font-weight: 700; color: #555;
  letter-spacing: 2px; padding: 4px 2px 0;
}

.opt-row {
  display: -webkit-flex; display: flex;
  gap: 6px;
}

.opt-btn { 
  -webkit-flex: 1; flex: 1;
  height: 56px;
  border-radius: 12px;
  border: 2px solid #2a2a2a;
  background: #1e1e1e; color: #666;
  font-size: 35px; font-weight: 900;
  cursor: pointer; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-appearance: none; appearance: none;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  -webkit-transition: all .1s; transition: all .1s;
}
.opt-btn:active { opacity: 0.6; }

/* 選中樣式 */
.opt-btn.sel-dry   { border-color: #aaa;    background: #2a2a2a; color: #fff; }
.opt-btn.sel-soup  { border-color: #4a90d0; background: #0a2040; color: #7ec8f8; }
.opt-btn.sel-small { border-color: #aaa;    background: #2a2a2a; color: #fff; }
.opt-btn.sel-big   { border-color: #d0a040; background: #2a1a00; color: #ffd060; }
.opt-btn.sel-in    { border-color: #40a060; background: #0a2010; color: #60d080; }
.opt-btn.sel-out   { border-color: #d06020; background: #2a1000; color: #f0a040; }
.opt-btn.sel-qty   { border-color: #c060e0; background: #1a0a28; color: #e090ff; }

/* 數量按鈕小一點的字 */
.opt-btn.qty-btn { font-size: 26px; }

/* 送出按鈕 */
.submit-btn {
  width: 100%; height: 60px;
  border-radius: 12px; border: none;
  background: #333; color: #555;
  font-size: 22px; font-weight: 900;
  cursor: pointer; touch-action: manipulation;
  -webkit-appearance: none; appearance: none;
  margin-top: 4px;
  -webkit-transition: background .15s, color .15s; transition: background .15s, color .15s;
}
.submit-btn.ready {
  background: linear-gradient(135deg, #e8a000, #c07800);
  color: #fff;
  box-shadow: 0 3px 12px rgba(232,160,0,0.3);
}
.submit-btn.ready:active { opacity: 0.7; }

/* ══════════════════════════
   第三欄：清單看板
══════════════════════════ */
.col-board {
  -webkit-flex: 1; flex: 1;
  display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  overflow: hidden;
  background: #0a0a0a;
}

.board-header {
  padding: 10px 16px;
  background: #111; border-bottom: 2px solid #1e1e1e;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: space-between; justify-content: space-between;
  -webkit-flex-shrink: 0; flex-shrink: 0;
}
.board-title { font-size: 18px; font-weight: 900; }
.pending-badge { font-size: 14px; color: #888; }
.pending-badge b { color: #fff; font-size: 24px; font-weight: 900; }

.board {
  -webkit-flex: 1; flex: 1;
  overflow-y: scroll; -webkit-overflow-scrolling: touch;
  padding: 10px 12px 80px;
}
.board-empty {
  height: 100%; display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  gap: 10px; opacity: 0.2; pointer-events: none;
}
.board-empty .ei { font-size: 56px; }
.board-empty .et { font-size: 18px; font-weight: 700; color: #666; }

/* 訂單列 */
.order-row {
  display: -webkit-flex; display: flex;
  -webkit-align-items: stretch; align-items: stretch;
  margin-bottom: 10px;
  border-radius: 16px; overflow: hidden;
  min-height: 74px;
  cursor: pointer; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-animation: row-in .2s cubic-bezier(.34,1.56,.64,1) both;
  animation: row-in .2s cubic-bezier(.34,1.56,.64,1) both;
}
.order-row:active { opacity: 0.5; }
@-webkit-keyframes row-in {
  from { opacity:0; -webkit-transform:translateX(-16px); }
  to   { opacity:1; -webkit-transform:translateX(0); }
}
@keyframes row-in {
  from { opacity:0; transform:translateX(-16px); }
  to   { opacity:1; transform:translateX(0); }
}
.order-row.removing {
  overflow: hidden;
  -webkit-animation: row-out .2s ease-in forwards !important;
  animation: row-out .2s ease-in forwards !important;
  pointer-events: none;
}
@-webkit-keyframes row-out {
  from { opacity:1; max-height:120px; margin-bottom:10px; }
  to   { opacity:0; max-height:0;     margin-bottom:0; }
}
@keyframes row-out {
  from { opacity:1; max-height:120px; margin-bottom:10px; }
  to   { opacity:0; max-height:0;     margin-bottom:0; }
}

.row-bar { width: 14px; -webkit-flex-shrink: 0; flex-shrink: 0; }

.row-body {
  -webkit-flex: 1; flex: 1;
  background: #1c1c1c;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  padding: 10px 18px;
  gap: 16px;
}

.row-noodle {
  font-size: 28px; font-weight: 900;
  padding: 5px 14px; border-radius: 10px;
  white-space: nowrap; -webkit-flex-shrink: 0; flex-shrink: 0;
}

.row-tags {
  display: -webkit-flex; display: flex;
  gap: 8px; -webkit-flex-wrap: wrap; flex-wrap: wrap;
  -webkit-flex: 1; flex: 1;
}
.row-tag {
  font-size: 24px; font-weight: 900;
  padding: 4px 14px; border-radius: 8px;
  white-space: nowrap;
}
.tag-soup  { background: #0a2040; color: #7ec8f8; }
.tag-dry   { background: #252525; color: #ccc; }
.tag-big   { background: #2a1a00; color: #ffd060; }
.tag-small { background: #252525; color: #ccc; }
.tag-out   { background: #2a1000; color: #f0a040; }
.tag-in    { background: #0a2010; color: #60d080; }
.tag-qty   { background: #1a0a28; color: #e090ff; min-width: 56px; text-align: center; }

/* ══ Reset ══ */
.reset-corner {
  position: fixed; bottom: calc(16px + var(--safe-bottom)); right: calc(16px + var(--safe-right));
  width: 52px; height: 52px; border-radius: 50%;
  border: 2px solid #2a2a2a; background: #181818; color: #444; font-size: 18px;
  cursor: pointer;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: center; justify-content: center;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: none; z-index: 100;
  -webkit-transition: border-color .2s, background .2s; transition: border-color .2s, background .2s;
}
.reset-corner.pressing { border-color: #ff5555; background: #2a1010; color: #ff5555; }
.reset-corner svg { position: absolute; top:0; left:0;
  -webkit-transform: rotate(-90deg); transform: rotate(-90deg); pointer-events: none; }
.reset-corner circle {
  fill: none; stroke: #ff5555; stroke-width: 3;
  stroke-dasharray: 157; stroke-dashoffset: 157; stroke-linecap: round;
  -webkit-transition: none; transition: none;
}
.reset-corner.pressing circle {
  stroke-dashoffset: 0;
  -webkit-transition: stroke-dashoffset 3s linear; transition: stroke-dashoffset 3s linear;
}

/* ══ Toast ══ */
.toast {
  position: fixed; bottom: calc(18px + var(--safe-bottom)); left: 50%;
  -webkit-transform: translateX(-50%) translateY(14px); transform: translateX(-50%) translateY(14px);
  background: #111; border: 2px solid #444; border-radius: 14px; padding: 12px 24px;
  font-size: 16px; font-weight: 700; color: #fff;
  z-index: 999; opacity: 0; pointer-events: none; white-space: nowrap;
  -webkit-transition: opacity .2s, -webkit-transform .2s; transition: opacity .2s, transform .2s;
}
.toast.show { opacity:1; -webkit-transform:translateX(-50%) translateY(0); transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 第一欄：麵種 -->
<div class="col-noodle" id="colNoodle"></div>

<!-- 第二欄：細節 -->
<div class="col-opts">
  <div class="opt-group-label">湯・乾</div>
  <div class="opt-row">
    <button type="button" class="opt-btn" id="opt-dry"  onclick="setOpt('soup',false)">乾</button>
    <button type="button" class="opt-btn" id="opt-soup" onclick="setOpt('soup',true)">湯</button>
  </div>

  <div class="opt-group-label">大・小</div>
  <div class="opt-row">
    <button type="button" class="opt-btn" id="opt-small" onclick="setOpt('big',false)">小</button>
    <button type="button" class="opt-btn" id="opt-big"   onclick="setOpt('big',true)">大</button>
  </div>

  <div class="opt-group-label">內・外</div>
  <div class="opt-row">
    <button type="button" class="opt-btn" id="opt-in"  onclick="setOpt('takeout',false)">內</button>
    <button type="button" class="opt-btn" id="opt-out" onclick="setOpt('takeout',true)">外</button>
  </div>

  <div class="opt-group-label">數量</div>
  <div class="opt-row" id="qtyRow1"></div>

  <button type="button" class="submit-btn" id="submitBtn" onclick="submitOrder()">送出</button>
</div>

<!-- 第三欄：清單 -->
<div class="col-board">
  <div class="board-header">
    <div class="board-title">🍜 煮麵清單</div>
    <div class="pending-badge">待煮 <b id="pendingCount">0</b> 份</div>
  </div>
  <div class="board" id="board">
    <div class="board-empty" id="boardEmpty">
      <div class="ei">🫕</div>
      <div class="et">左側選好後按送出</div>
    </div>
  </div>
</div>

<div class="reset-corner" id="resetCorner">
  <svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/></svg>
  🗑
</div>
<div class="toast" id="toast"></div>

<script>
var NOODLES = [
  { id:'oil',   name:'油麵',   bg:'#F5C518', text:'#1a1000' },
  { id:'thick', name:'粗陽春', bg:'#F0F0F0', text:'#111111' },
  { id:'thin',  name:'細陽春', bg:'#A8D8F0', text:'#0a2a40' },
  { id:'bean',  name:'冬粉',   bg:'#7ED98A', text:'#082210' },
  { id:'rice',  name:'米粉',   bg:'#C8A0E8', text:'#1a0030' },
  { id:'meat',  name:'肉羹',   bg:'#E8503A', text:'#fff'    },
  { id:'squid', name:'花枝',   bg:'#F9C8E0', text:'#3a0020' },
  { id:'fish',  name:'魚酥',   bg:'#F4A44A', text:'#2a1000' },
  { id:'squid2',name:'魷魚',   bg:'#7EC8E8', text:'#002a3a' },
];

var state = { noodle:null, soup:false, big:false, takeout:false, qty:1 };
var tiles = load();
var seq = tiles.length ? Math.max.apply(null, tiles.map(function(t){ return t.s||0; })) : 0;

/* ── Audio ── */
var _ctx=null;
function actx(){
  if(!_ctx) _ctx=new(window.AudioContext||window.webkitAudioContext)();
  if(_ctx.state==='suspended') _ctx.resume();
  return _ctx;
}
function beep(type){
  try{
    var c=actx();
    var pairs=type==='add'?[[440,0],[660,0.1]]:[[660,0],[440,0.1]];
    pairs.forEach(function(p){
      var o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.frequency.value=p[0];
      var t=c.currentTime+p[1];
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.2,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
      o.start(t);o.stop(t+0.22);
    });
  }catch(e){}
}

/* ── Storage ── */
function load(){ try{return JSON.parse(localStorage.getItem('nm8')||'[]');}catch(e){return[];} }
function save(){ try{localStorage.setItem('nm8',JSON.stringify(tiles));}catch(e){} }
function getNoodle(id){
  for(var i=0;i<NOODLES.length;i++) if(NOODLES[i].id===id) return NOODLES[i];
  return{id:id,name:id,bg:'#888',text:'#000'};
}

/* ── Build 第一欄麵種 ── */
function buildNoodleBtns(){
  var c=document.getElementById('colNoodle');
  c.innerHTML='';
  NOODLES.forEach(function(n){
    var btn=document.createElement('button');
    btn.type='button'; btn.className='noodle-btn'; btn.id='nb-'+n.id;
    btn.style.background=n.bg;
    btn.innerHTML=
      '<span class="noodle-btn-name" style="color:'+n.text+'">'+n.name+'</span>'+
      '<span class="noodle-btn-cnt" id="nc-'+n.id+'" style="color:'+n.text+'">0</span>';
    btn.onclick=(function(id){return function(){selectNoodle(id);};})(n.id);
    c.appendChild(btn);
  });
}

function selectNoodle(id){
  actx();
  state.noodle=id;
  var btns=document.querySelectorAll('.noodle-btn');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('selected');
  var el=document.getElementById('nb-'+id);
  if(el) el.classList.add('selected');
  updateSubmitBtn();
}

/* ── Build 數量按鈕 ── */
function buildQtyBtns(){
  var r1=document.getElementById('qtyRow1');
  r1.innerHTML='';
  r1.style.cssText='-webkit-flex-direction:column;flex-direction:column;gap:6px;display:-webkit-flex;display:flex;';
  for(var i=1;i<=5;i++){
    var btn=document.createElement('button');
    btn.type='button'; btn.className='opt-btn qty-btn'; btn.id='opt-qty-'+i;
    btn.textContent=i;
    btn.style.width='100%';
    btn.onclick=(function(q){return function(){setOpt('qty',q);};})(i);
    r1.appendChild(btn);
  }
}

/* ── 選項狀態 ── */
function setOpt(key,val){
  actx();
  state[key]=val;
  updateOptUI();
}

function updateOptUI(){
  document.getElementById('opt-dry').className   ='opt-btn'+(!state.soup?'    sel-dry':'');
  document.getElementById('opt-soup').className  ='opt-btn'+(state.soup?'   sel-soup':'');
  document.getElementById('opt-small').className ='opt-btn'+(!state.big?'   sel-small':'');
  document.getElementById('opt-big').className   ='opt-btn'+(state.big?'    sel-big':'');
  document.getElementById('opt-in').className    ='opt-btn'+(!state.takeout?' sel-in':'');
  document.getElementById('opt-out').className   ='opt-btn'+(state.takeout?' sel-out':'');
  for(var i=1;i<=5;i++){
    var el=document.getElementById('opt-qty-'+i);
    if(el) el.className='opt-btn qty-btn'+(state.qty===i?' sel-qty':'');
  }
  updateSubmitBtn();
}

function updateSubmitBtn(){
  var btn=document.getElementById('submitBtn');
  if(state.noodle){
    btn.className='submit-btn ready';
    var n=getNoodle(state.noodle);
    btn.textContent='送出 '+n.name;
  } else {
    btn.className='submit-btn';
    btn.textContent='送出';
  }
}

/* ── 送出訂單 ── */
function submitOrder(){
  if(!state.noodle) return;
  seq++;
  var t={
    id:Date.now().toString(36)+(seq%999),
    s:seq, n:state.noodle,
    soup:state.soup, big:state.big,
    takeout:state.takeout, qty:state.qty
  };
  tiles.push(t);
  save();
  addRowToDOM(t);
  updateBtnCounts();
  beep('add');

  /* 清掉麵種選擇，細節保留 */
  state.noodle=null;
  var btns=document.querySelectorAll('.noodle-btn');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('selected');
  updateSubmitBtn();
}

function updateBtnCounts(){
  NOODLES.forEach(function(n){
    var cnt=tiles.filter(function(t){return t.n===n.id;}).length;
    var el=document.getElementById('nc-'+n.id);
    if(!el) return;
    el.textContent=cnt;
    if(cnt>0) el.classList.add('show'); else el.classList.remove('show');
  });
  document.getElementById('pendingCount').textContent=tiles.length;
}

/* ── 新增列到看板 ── */
function addRowToDOM(tile){
  var board=document.getElementById('board');
  document.getElementById('boardEmpty').style.display='none';

  var n=getNoodle(tile.n);
  var row=document.createElement('div');
  row.className='order-row'; row.id='row-'+tile.id;

  var bar=document.createElement('div');
  bar.className='row-bar'; bar.style.background=n.bg;

  var body=document.createElement('div');
  body.className='row-body';

  var tagSoup  =tile.soup    ?'<span class="row-tag tag-soup">湯</span>'  :'<span class="row-tag tag-dry">乾</span>';
  var tagSize  =tile.big     ?'<span class="row-tag tag-big">大</span>'   :'<span class="row-tag tag-small">小</span>';
  var tagPlace =tile.takeout ?'<span class="row-tag tag-out">外</span>'   :'<span class="row-tag tag-in">內</span>';
  var tagQty   ='<span class="row-tag tag-qty">&times;'+(tile.qty||1)+'</span>';

  body.innerHTML=
    '<div class="row-noodle" style="background:'+n.bg+';color:'+n.text+'">'+n.name+'</div>'+
    '<div class="row-tags">'+tagSoup+tagSize+tagPlace+tagQty+'</div>';

  row.appendChild(bar); row.appendChild(body);
  row.onclick=(function(id){return function(){removeRow(id);};})(tile.id);
  board.insertBefore(row, board.firstChild);
}

/* ── 移除列 ── */
function removeRow(id){
  var el=document.getElementById('row-'+id);
  if(!el) return;
  beep('done');
  el.classList.add('removing'); el.onclick=null;
  setTimeout(function(){
    tiles=tiles.filter(function(t){return t.id!==id;});
    save();
    if(el.parentNode) el.parentNode.removeChild(el);
    if(!tiles.length){
      var board=document.getElementById('board'),empty=document.getElementById('boardEmpty');
      board.innerHTML=''; board.appendChild(empty); empty.style.display='flex';
    }
    updateBtnCounts();
  },220);
}

/* ── Reset ── */
var pressTimer=null,pressingReset=false;
function resetStart(e){
  e.preventDefault(); if(pressingReset)return; pressingReset=true;
  document.getElementById('resetCorner').classList.add('pressing');
  pressTimer=setTimeout(doReset,3000);
}
function resetEnd(){
  if(!pressingReset)return; pressingReset=false;
  clearTimeout(pressTimer);
  document.getElementById('resetCorner').classList.remove('pressing');
}
function doReset(){
  pressingReset=false;
  document.getElementById('resetCorner').classList.remove('pressing');
  if(!tiles.length){showToast('目前沒有訂單');return;}
  tiles=[];save();
  var board=document.getElementById('board'),empty=document.getElementById('boardEmpty');
  board.innerHTML='';board.appendChild(empty);empty.style.display='flex';
  updateBtnCounts();showToast('已清除所有訂單');
}

function showToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2000);
}

/* ── Restore ── */
function restore(){
  if(!tiles.length)return;
  var sorted=tiles.slice().sort(function(a,b){return (a.s||0)-(b.s||0);});
  sorted.forEach(function(t){addRowToDOM(t);});
  updateBtnCounts();
}

/* ── Wake Lock ── */
function wakeLock(){
  if('wakeLock'in navigator) navigator.wakeLock.request('screen').catch(function(){});
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible') wakeLock();
});

var rc=document.getElementById('resetCorner');
rc.addEventListener('touchstart',resetStart,{passive:false});
rc.addEventListener('touchend',  resetEnd,  false);
rc.addEventListener('touchcancel',resetEnd, false);
rc.addEventListener('mousedown', resetStart,false);
rc.addEventListener('mouseup',   resetEnd,  false);
rc.addEventListener('mouseleave',resetEnd,  false);

buildNoodleBtns();
buildQtyBtns();
updateOptUI();
restore();
wakeLock();
</script>
</body>
</html>
